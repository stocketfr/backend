name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@stocketfr"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - run: pnpm install --lockfile-only --no-frozen-lockfile
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-stable-lockfile
          path: backend/pnpm-lock.yaml

  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          path: backend
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@stocketfr"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm type-check

  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          path: backend
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@stocketfr"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          path: backend
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@stocketfr"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stocket_inventory_test

  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          path: backend
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@stocketfr"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
